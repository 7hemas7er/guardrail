name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hook-cases:
    name: guard.py hook cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: valid JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json examples/*.json tests/guardrail.test.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done
      - name: hook syntax
        run: |
          python3 -m py_compile hooks/guard.py hooks/mask.py hooks/session-start.py tests/run.py tests/test_session_start.py tests/test_mask.py tests/test_activation.py tests/test_mcp.py
          bash -n hooks/run-python.sh tests/fixtures/*.sh
      - name: guard.py hook cases
        run: python3 tests/run.py -v
      - name: masking of reserved terms
        run: python3 tests/test_mask.py
      - name: per-project activation
        run: python3 tests/test_activation.py
      - name: MCP with deeply nested input
        run: python3 tests/test_mcp.py
      - name: session-start (rules, one-time notices)
        run: python3 tests/test_session_start.py
      - name: session-start via run-python.sh
        run: |
          out=$(echo '{}' | bash hooks/run-python.sh hooks/session-start.py)
          echo "$out" | grep -q "core rules" || { echo "RULES-CORE not injected"; exit 1; }
